<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon compte — Arcade Relics</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <main style="max-width:1200px;margin:auto;padding:40px 20px;">

        <h1>Mon compte Arcade Relics</h1>

        <div id="loading">
            Chargement de votre collection...
        </div>

        <div id="accountContent" hidden>

            <p id="userEmail"></p>

            <button id="logoutBtn">
                Déconnexion
            </button>

            <hr>

            <h2>Ma collection</h2>

            <p>
                🎮 Jeux :
                <strong id="gamesCount">0</strong>
            </p>

            <p>
                🎛️ Consoles :
                <strong id="consolesCount">0</strong>
            </p>

            <p>
                💜 Wishlist :
                <strong id="wishlistCount">0</strong>
            </p>

            <div id="collectionList"></div>

        </div>

        <div id="errorMessage"></div>

    </main>

    <script type="module" src="assets/js/compte.js?v=20260911_1">
    </script>

</body>

</html>
