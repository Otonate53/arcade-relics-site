name: Replace site exactly

on:
  push:
    branches:
      - agent/replace-site-exact-20260812

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and verify exact payload
        shell: bash
        run: |
          set -euo pipefail

          cat .payload/part*.b64 | base64 -d > /tmp/changed.tar.gz
          echo "7f8488f20d70abcd91a599c891b7a4397926c1049ee83f42695645dea1abdf71  /tmp/changed.tar.gz" | sha256sum -c -

          rm -f \
            assets/css/style-1.css \
            assets/css/style-2.css \
            assets/css/style-3.css \
            assets/css/style-4.css \
            assets/css/style-5.css

          tar -xzf /tmp/changed.tar.gz -C .

          test "$(git hash-object assets/css/style.css)" = "3e657a35d6191529619f33db5a2dde841626fe0f"
          test "$(git hash-object assets/img/discord-logo.svg)" = "bb26f53245a16cd91cb572d248dc5e28c9857a33"
          test "$(git hash-object assets/js/main.js)" = "2a62e82ada68b396724c0d67741d16105d25a5e8"
          test "$(git hash-object pages/index.html)" = "69f5ad9bc808a67d74b16a19c7805bc2a5051034"

          rm -rf .payload
          rm -f .github/workflows/replace-site-exact.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          find . -path './.git' -prune -o -type f -printf '%P\n' | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          CNAME
          assets/css/confidentialite.css
          assets/css/style.css
          assets/img/android-chrome-192x192.png
          assets/img/android-chrome-512x512.png
          assets/img/apple-touch-icon.png
          assets/img/discord-logo.svg
          assets/img/favicon-16x16.png
          assets/img/favicon-32x32.png
          assets/img/favicon-48x48.png
          assets/img/favicon.ico
          assets/img/logo-arcade-relics.png
          assets/img/page_acceuil.png
          assets/img/page_console.png
          assets/img/page_recherche.png
          assets/img/page_wishlist.png
          assets/img/telephone-arcade-relics-v2.jpg
          assets/img/x-logo.svg
          assets/js/main.js
          index.html
          pages/confidentialite.html
          pages/index.html
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace site contents from uploaded archive"
          git push origin HEAD:main
          git push origin --delete "${GITHUB_REF_NAME}" || true
